plugins {
	id 'fabric-loom' version "${loom_version}"
}

// CI passes -Pbuild_number so every dev build gets a distinct jar name
version = project.mod_version + (project.hasProperty('build_number') ? "+build.${project.build_number}" : '')
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Test-only code (GameTests, screenshot harness, world generator). Never shipped in the mod jar.
sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	createRemapConfigurations(sourceSets.gametest)

	mods {
		ender_obelisks {
			sourceSet sourceSets.main
		}
		ender_obelisks_test {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// Headless dedicated server that runs every @GameTest and writes a JUnit report
		gametest {
			server()
			name 'Game Test'
			vmArg '-Dfabric-api.gametest'
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir 'build/gametest'
			source sourceSets.gametest
		}
		// Dedicated server that creates a flat world for the harness and stops right away
		genworld {
			server()
			name 'Generate Harness World'
			vmArg '-Dender_obelisks.genworld=true'
			runDir 'build/harness-server'
			source sourceSets.gametest
		}
		// Real client (under Xvfb in CI) that plays a scripted scenario and saves a screenshot
		harness {
			client()
			name 'Harness Client'
			vmArg '-Dender_obelisks.harness=true'
			programArgs '--quickPlaySingleplayer', 'harness', '--width', '1280', '--height', '720'
			runDir 'build/harness-client'
			source sourceSets.gametest
		}
	}
}

tasks.named('runGametest') {
	doFirst {
		delete "${project.layout.buildDirectory.get()}/gametest/world"
		delete "${project.layout.buildDirectory.get()}/gametest/junit.xml"
	}
}

repositories {
	// JourneyMap's API (compile only; JourneyMap itself is optional at runtime)
	maven {
		name = 'JourneyMap'
		url = 'https://jm.gserv.me/repository/maven-public/'
	}
	// JourneyMap itself, for the client harness
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Its pom drags an old Fabric API onto the classpath, hence transitive = false
	modCompileOnly("info.journeymap:journeymap-api:${project.journeymap_api_version}") { transitive = false }
	// The harness runs with the real JourneyMap so the markers can be photographed
	modGametestRuntimeOnly("maven.modrinth:journeymap:${project.journeymap_version}") { transitive = false }
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
